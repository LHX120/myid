<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子身份证</title>
    <style>
        body { margin: 0; background: #f8f9fb; font-family: -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
        .header { background: #2b7bed; color: white; height: 44px; display: flex; align-items: center; padding: 0 12px; position: relative; }
        .nav-left { display: flex; align-items: center; gap: 14px; font-size: 17px; flex: 1; }
        
        /* 胶囊区域像素级复刻 */
        .capsule { 
            background: rgba(0, 0, 0, 0.12); /* 调整透明度 */
            border-radius: 20px; 
            padding: 3px 10px; 
            display: flex; 
            align-items: center;
            gap: 0; 
            border: 0.5px solid rgba(255, 255, 255, 0.2); 
            height: 26px;
        }
        .capsule-item { display: flex; align-items: center; justify-content: center; padding: 0 6px; }
        .divider { width: 0.5px; height: 14px; background: rgba(255, 255, 255, 0.2); margin: 0 2px; }
        
        .sub-header { padding: 16px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
        .title-text { font-size: 15px; color: #000; font-weight: 400; }
        .refresh-btn { background: #4a90e2; color: white; font-size: 12px; padding: 4px 10px; border-radius: 4px; }
        .content { padding: 0 16px; }
        .id-card { width: 100%; border-radius: 12px; background: #ffffff; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 12px; overflow: hidden; }
        .id-card img { width: 100%; display: block; }
        .time-display { text-align: center; margin: 20px 0 25px; color: #4484e5; font-size: 21px; font-weight: 500; font-family: "Helvetica Neue", Arial; }
        .footer { padding: 0 16px; margin-bottom: 30px; }
        .footer img { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav-left">
            <span style="font-weight: 300;">〈</span> 
            <span style="font-size:22px; margin-left: -2px; margin-bottom: 4px;">⌂</span> 
            <span style="margin-left: 2px;">电子身份证</span>
        </div>
        
        <div class="capsule">
            <div class="capsule-item" style="font-size: 16px;">☆</div>
            <div class="capsule-item" style="font-size: 14px; letter-spacing: -1px; margin-left: 2px;">•••</div>
            <div class="divider"></div>
            <div class="capsule-item" style="font-size: 18px; position: relative;">
                ○<span style="position: absolute; font-size: 8px; transform: scale(0.6);">★</span>
            </div>
        </div>
    </div>

    <div class="sub-header">
        <span class="title-text">电子身份证</span>
        <span class="refresh-btn">刷新信息</span>
    </div>

    <div class="content">
        <div class="id-card"><img src="这里粘贴1.jpg转换后的Base64代码"></div>
        <div class="id-card"><img src="这里粘贴2.jpg转换后的Base64代码"></div>
        <div id="clock" class="time-display"></div>
        <div class="footer"><img src="这里粘贴3.jpg转换后的Base64代码"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            // 修正：月份、日期、小时均不补零（1:19:12 风格）
            const timeStr = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('clock').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
