    <script>
        function updateClock() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            // 修正：月份、日期、小时均不补零（1:19:12 风格）
            const timeStr = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('clock').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
