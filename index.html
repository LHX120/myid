    <script>
        // 1. 访问验证：放在脚本最前端
        var accessCode = prompt("请输入您的专属访问码:");
        if (accessCode !== "876432") { 
            document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>访问受限：密码错误</h1>";
            window.location.href = "about:blank"; 
        }
        function update() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            // 月份/日期不补零，分/秒补零，还原 1:19:12 风格
            document.getElementById('clock').innerText = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }
        setInterval(update, 1000);
        update();
    </script>
